<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #f5f5f1; font-family: 'Hanken Grotesk', sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; padding: 36px; }
  .cell { background: #fff; border: 1px solid #dee1da; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .cell h4 { margin: 0; font-size: 15px; color: #5e6470; }
  .sizes { display: flex; gap: 18px; align-items: end; }
  .lock { display: flex; align-items: center; gap: 12px; }
  .lock b { font-size: 40px; letter-spacing: -0.04em; font-weight: 800; color: #16181d; }
  .dark { background: #1d2230; padding: 14px 18px; border-radius: 12px; }
  .dark b { color: #fff; }
</style>
</head>
